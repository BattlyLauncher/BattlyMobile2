plugins {
    id 'com.android.application' version '8.7.2'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    ByteArrayOutputStream BRANCH = new ByteArrayOutputStream()
    // Used by the fallback for github actions
    ByteArrayOutputStream TAG_PART_COMMIT = new ByteArrayOutputStream()
    String TAG_STRING

    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    if (TAG.toString() == "") {
        exec {
            // Fallback for action builds
            try {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue true
                standardOutput = TAG_PART_COMMIT
            } catch (Exception e) {
            }
        }
    }


    if(TAG.toString() != ""){
        TAG_STRING = TAG.toString()
    }else {
        if(TAG_PART_COMMIT.toString().trim() == ""){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'battly-mobile-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    exec {
        try {
            commandLine 'git', 'branch', '--show-current'
            ignoreExitValue true
            standardOutput = BRANCH
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    return TAG_STRING.trim().replace("-g", "-") + "-" + BRANCH.toString().trim()
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("./curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseStoreFile = signingProperties.getProperty("storeFile", System.getenv("GPLAY_KEYSTORE_FILE"))
def releaseStorePassword = signingProperties.getProperty("storePassword", System.getenv("GPLAY_KEYSTORE_PASSWORD"))
def releaseKeyAlias = signingProperties.getProperty("keyAlias", System.getenv("GPLAY_KEY_ALIAS") ?: "upload")
def releaseKeyPassword = signingProperties.getProperty("keyPassword", System.getenv("GPLAY_KEY_PASSWORD") ?: releaseStorePassword)
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null
def localDebugKeystore = rootProject.file("app_pojavlauncher/debug.keystore")
def legacyLocalDebugKeystore = rootProject.file("release-secrets/debug.keystore")
def hasLocalDebugKeystore = localDebugKeystore.exists() || legacyLocalDebugKeystore.exists()
def selectedLocalDebugKeystore = localDebugKeystore.exists() ? localDebugKeystore : legacyLocalDebugKeystore

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 35

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        debug {
            if (hasLocalDebugKeystore) {
                storeFile selectedLocalDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        googlePlayBuild {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.tecnobros.battlylauncher"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 10000005
        versionName "2.0.0"
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true",
                        "APP_LDFLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            resValue 'string', 'application_package', 'com.tecnobros.battlylauncher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.tecnobros.battlylauncher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.tecnobros.battlylauncher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue 'string', 'storageProviderAuthorities', 'com.tecnobros.battlylauncher.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.tecnobros.battlylauncher'
            resValue 'string', 'shareProviderAuthority', 'com.tecnobros.battlylauncher.scoped.controlfolder'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            // Pojav's JVM bridge loads native libraries from ApplicationInfo.nativeLibraryDir.
            // Keep native libs extracted until the launcher has its own APK-native extraction path.
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '36.0.0'

}

afterEvaluate {
    // Explicit dependencies for which the apk relies on
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":lwjgl2_methods_injector:jar", ":jre_lwjgl3glfw:jar")
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildsGooglePlay = taskGraph.allTasks.any { task ->
        task.path.toLowerCase(Locale.ROOT).contains("gplay")
    }
    if (buildsGooglePlay && !hasReleaseSigning) {
        throw new GradleException("Missing release signing config. Provide keystore.properties or GPLAY_KEYSTORE_* environment variables before building gplay.")
    }
}

