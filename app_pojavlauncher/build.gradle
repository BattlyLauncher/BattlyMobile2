plugins {
    id 'com.android.application' version '8.11.1'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    ByteArrayOutputStream BRANCH = new ByteArrayOutputStream()
    // Used by the fallback for github actions
    ByteArrayOutputStream TAG_PART_COMMIT = new ByteArrayOutputStream()
    String TAG_STRING

    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    if (TAG.toString() == "") {
        exec {
            // Fallback for action builds
            try {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue true
                standardOutput = TAG_PART_COMMIT
            } catch (Exception e) {
            }
        }
    }


    if(TAG.toString() != ""){
        TAG_STRING = TAG.toString()
    }else {
        if(TAG_PART_COMMIT.toString().trim() == ""){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'battly-mobile-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    exec {
        try {
            commandLine 'git', 'branch', '--show-current'
            ignoreExitValue true
            standardOutput = BRANCH
        } catch (Exception e) {
            e.printStackTrace();
        }
    }

    return TAG_STRING.trim().replace("-g", "-") + "-" + BRANCH.toString().trim()
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("./curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseStoreFile = signingProperties.getProperty("storeFile", System.getenv("GPLAY_KEYSTORE_FILE"))
def releaseStorePassword = signingProperties.getProperty("storePassword", System.getenv("GPLAY_KEYSTORE_PASSWORD"))
def releaseKeyAlias = signingProperties.getProperty("keyAlias", System.getenv("GPLAY_KEY_ALIAS") ?: "upload")
def releaseKeyPassword = signingProperties.getProperty("keyPassword", System.getenv("GPLAY_KEY_PASSWORD") ?: releaseStorePassword)
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null
def localDebugKeystore = rootProject.file("app_pojavlauncher/debug.keystore")
def legacyLocalDebugKeystore = rootProject.file("release-secrets/debug.keystore")
def hasLocalDebugKeystore = localDebugKeystore.exists() || legacyLocalDebugKeystore.exists()
def selectedLocalDebugKeystore = localDebugKeystore.exists() ? localDebugKeystore : legacyLocalDebugKeystore
def battlyGoogleDebugClientId = System.getenv("BATTLY_GOOGLE_DEBUG_CLIENT_ID")
        ?: System.getenv("BATTLY_GOOGLE_WEB_CLIENT_ID")
        ?: "490291541450-0ocq9cfvovh2ft45a9kgsvf12cos4emm.apps.googleusercontent.com"
def battlyGoogleReleaseClientId = System.getenv("BATTLY_GOOGLE_RELEASE_CLIENT_ID")
        ?: System.getenv("BATTLY_GOOGLE_WEB_CLIENT_ID")
        ?: "490291541450-r17e3frigvot7b8a2lhu32k2dp8eqq28.apps.googleusercontent.com"
def battlyWorldsEnabled = providers.gradleProperty("battlyWorldsEnabled")
        .map { value -> value.toBoolean() }
        .orElse(true)
        .get()
def battlyWorldsVpnEnabled = providers.gradleProperty("battlyWorldsVpnEnabled")
        .map { value -> value.toBoolean() }
        .orElse(false)
        .get()
def battlyWorldsManifestSource = file("src/main/AndroidManifest.xml")
def battlyWorldsGeneratedManifest = file("${buildDir}/generated/battlyworlds/AndroidManifest.xml")
def generatedThirdPartyAssets = file("${buildDir}/generated/third_party_assets")
def generateBattlyWorldsManifest = tasks.register("generateBattlyWorldsManifest") {
    inputs.file battlyWorldsManifestSource
    inputs.property "battlyWorldsEnabled", battlyWorldsEnabled
    inputs.property "battlyWorldsVpnEnabled", battlyWorldsVpnEnabled
    outputs.file battlyWorldsGeneratedManifest
    doLast {
        String manifestText = battlyWorldsManifestSource.getText("UTF-8")
        if (!battlyWorldsEnabled || !battlyWorldsVpnEnabled) {
            manifestText = manifestText
                    .replaceAll(/(?s)\s*<!-- BATTLYWORLDS_PERMISSION_START -->.*?<!-- BATTLYWORLDS_PERMISSION_END -->/, "")
                    .replaceAll(/(?s)\s*<!-- BATTLYWORLDS_SERVICE_START -->.*?<!-- BATTLYWORLDS_SERVICE_END -->/, "")
        }
        battlyWorldsGeneratedManifest.parentFile.mkdirs()
        battlyWorldsGeneratedManifest.setText(manifestText, "UTF-8")
    }
}
def syncThirdPartyLicenses = tasks.register("syncThirdPartyLicenses", Copy) {
    File ltwLicense = rootProject.file("LTW/LICENSE")
    doFirst {
        if (!ltwLicense.isFile()) {
            throw new GradleException(
                    "LTW source is missing. Initialize submodules before building Battly Mobile.")
        }
    }
    from(ltwLicense)
    into(new File(generatedThirdPartyAssets, "licenses"))
    rename { "LTW-LICENSE.txt" }
}

def battlyDebugAbi = project.findProperty('battlyDebugAbi')?.toString()?.trim()
def battlyDebugAbis = battlyDebugAbi
        ? [battlyDebugAbi]
        : ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 36

    lintOptions {
        abortOnError true
        // Back is deliberately forwarded to Minecraft and Battly's custom
        // navigation. Predictive-back callbacks would change game input.
        disable 'GestureBackNavigation'
    }

    signingConfigs {
        debug {
            if (hasLocalDebugKeystore) {
                storeFile selectedLocalDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        googlePlayBuild {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.tecnobros.battlylauncher"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 10000023
        versionName "2.2.3"
        multiDexEnabled true //important
        buildConfigField "boolean", "BATTLY_WORLDS_ENABLED", battlyWorldsEnabled.toString()
        buildConfigField "boolean", "BATTLY_WORLDS_VPN_ENABLED", battlyWorldsVpnEnabled.toString()
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true",
                        "APP_LDFLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            resValue 'string', 'battly_google_server_client_id', battlyGoogleDebugClientId
            resValue 'string', 'application_package', 'com.tecnobros.battlylauncher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.tecnobros.battlylauncher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.tecnobros.battlylauncher.scoped.controlfolder.debug'
            resValue 'string', 'admob_app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'battly_modpack_native_ad_unit_id', 'ca-app-pub-3940256099942544/2247696110'
            resValue 'string', 'battly_starting_native_ad_unit_id', 'ca-app-pub-3940256099942544/2247696110'
            resValue 'string', 'battly_workspace_native_ad_unit_id', 'ca-app-pub-3940256099942544/2247696110'
            resValue 'string', 'battly_controls_native_ad_unit_id', 'ca-app-pub-3940256099942544/2247696110'
            resValue 'string', 'battly_worlds_rewarded_interstitial_ad_unit_id', 'ca-app-pub-3940256099942544/5354046379'
            ndk {
                abiFilters(*battlyDebugAbis)
            }
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = [ 'debug', 'release' ]
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
            matchingFallbacks = [ 'proguard', 'release' ]
        }

        release {
            // Battly relies heavily on reflection, XML-instantiated classes, JNI,
            // Gson models and weak event listeners. Keep production deterministic;
            // R8 remains available only through the internal proguard variants.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue 'string', 'storageProviderAuthorities', 'com.tecnobros.battlylauncher.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.tecnobros.battlylauncher'
            resValue 'string', 'shareProviderAuthority', 'com.tecnobros.battlylauncher.scoped.controlfolder'
            resValue 'string', 'battly_google_server_client_id', battlyGoogleReleaseClientId
            resValue 'string', 'admob_app_id', 'ca-app-pub-2325315275982779~8627332387'
            resValue 'string', 'battly_modpack_native_ad_unit_id', 'ca-app-pub-2325315275982779/1111917012'
            resValue 'string', 'battly_starting_native_ad_unit_id', 'ca-app-pub-2325315275982779/5047978353'
            resValue 'string', 'battly_workspace_native_ad_unit_id', 'ca-app-pub-2325315275982779/8101517106'
            resValue 'string', 'battly_controls_native_ad_unit_id', 'ca-app-pub-2325315275982779/5047978353'
            resValue 'string', 'battly_worlds_rewarded_interstitial_ad_unit_id', 'ca-app-pub-2325315275982779/1926553621'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile battlyWorldsGeneratedManifest
            assets.srcDir generatedThirdPartyAssets
        }
    }

    ndkVersion "28.2.13676358"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            // Pojav's JVM bridge loads native libraries from ApplicationInfo.nativeLibraryDir.
            // Keep native libs extracted until the launcher has its own APK-native extraction path.
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
        aidl true
    }

    buildToolsVersion = '36.0.0'

}

afterEvaluate {
    tasks.named("preBuild").configure {
        dependsOn syncThirdPartyLicenses
    }
    tasks.matching {
        it.name.startsWith("process") && it.name.endsWith("MainManifest")
    }.configureEach {
        dependsOn generateBattlyWorldsManifest
    }

    // Explicit dependencies for which the apk relies on
    def generatedComponentTasks = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":lwjgl2_methods_injector:jar",
            ":jre_lwjgl3glfw:patchMergedLwjglModules"
    ]
    tasks.matching { task ->
        (task.name.startsWith("merge") && task.name.endsWith("Assets"))
                || task.name.toLowerCase(Locale.ROOT).contains("lint")
    }.configureEach {
        dependsOn(generatedComponentTasks)
    }

    def criticalR8Classes = [
            "com.kdt.mcgui.mcAccountSpinner",
            "net.kdt.pojavlaunch.fragments.BattlyPlusFragment",
            "net.kdt.pojavlaunch.fragments.BackgroundSettingsFragment",
            "net.kdt.pojavlaunch.modloaders.modpacks.models.ModrinthIndex",
            "net.kdt.pojavlaunch.modloaders.modpacks.models.CurseManifest",
            "net.kdt.pojavlaunch.value.MinecraftAccount",
            "net.kdt.pojavlaunch.customcontrols.CustomControls",
            "net.kdt.pojavlaunch.customcontrols.gamepad.GamepadMapStore",
            "net.kdt.pojavlaunch.utils.JREUtils",
            "net.kdt.pojavlaunch.Logger",
            "org.libsdl.app.SDLActivity",
            "org.libsdl.app.SDLControllerManager",
            "org.lwjgl.glfw.CallbackBridge"
    ]
    def criticalR8Members = [
            "net.kdt.pojavlaunch.extra.ExtraListener mMojangLoginListener -> mMojangLoginListener",
            "net.kdt.pojavlaunch.extra.ExtraListener mMicrosoftLoginListener -> mMicrosoftLoginListener"
    ]

    ["proguard", "proguardNoDebug"].each { buildTypeName ->
        def buildTypeCap = buildTypeName.capitalize()
        def verifyTask = tasks.register("verify${buildTypeCap}R8Mapping") {
            group = "verification"
            description = "Fail if R8 renames classes loaded through XML, Gson, reflection or JNI (${buildTypeName})."
            dependsOn "minify${buildTypeCap}WithR8"
            doLast {
                File mappingFile = file("${buildDir}/outputs/mapping/${buildTypeName}/mapping.txt")
                if (!mappingFile.isFile()) {
                    throw new GradleException("R8 mapping not found: ${mappingFile}")
                }
                Set<String> mappingLines = mappingFile.readLines("UTF-8")
                        .collect { it.trim() } as Set
                def renamedClasses = criticalR8Classes.findAll { className ->
                    String expectedMapping = "${className} -> ${className}:"
                    !mappingLines.contains(expectedMapping)
                }
                if (!renamedClasses.isEmpty()) {
                    throw new GradleException(
                            "R8 renamed reflection/JNI-critical classes:\n - " +
                                    renamedClasses.join("\n - "))
                }
                def removedOrRenamedMembers = criticalR8Members.findAll { member ->
                    !mappingLines.contains(member)
                }
                if (!removedOrRenamedMembers.isEmpty()) {
                    throw new GradleException(
                            "R8 removed or renamed authentication-critical members:\n - " +
                                    removedOrRenamedMembers.join("\n - "))
                }
            }
        }
        tasks.matching {
            it.name == "assemble${buildTypeCap}" || it.name == "bundle${buildTypeCap}"
        }.configureEach {
            dependsOn verifyTask
        }
    }
}

android.applicationVariants.all { variant ->
    def variantCap = variant.name.capitalize()
    def pythonExe = System.getenv("PYTHON") ?: "python"
    def verifyLtwPackaging = tasks.register("verify${variantCap}LtwPackaging") {
        group = "verification"
        description = "Verify that LTW is packaged for every ABI in ${variant.name}."
        dependsOn "merge${variantCap}NativeLibs"
        doLast {
            File mergedLibRoot = file(
                    "${buildDir}/intermediates/merged_native_libs/${variant.name}/" +
                            "merge${variantCap}NativeLibs/out/lib")
            List<File> abiDirectories = mergedLibRoot.listFiles()
                    ?.findAll { File candidate -> candidate.isDirectory() }
                    ?: []
            if (abiDirectories.isEmpty()) {
                throw new GradleException("No merged native ABI directories found at ${mergedLibRoot}")
            }

            List<String> missingAbis = abiDirectories.findAll { File abiDirectory ->
                File ltwLibrary = new File(abiDirectory, "libltw.so")
                !ltwLibrary.isFile() || ltwLibrary.length() == 0L
            }.collect { File abiDirectory -> abiDirectory.name }
            if (!missingAbis.isEmpty()) {
                throw new GradleException(
                        "LTW is missing from the packaged native libraries for: " +
                                missingAbis.join(", "))
            }
        }
    }
    def nativePageSizeArgs = [
            pythonExe,
            "tools/android/elf_16k_page_align.py",
            "--fix",
            "--allow-missing"
    ]
    nativePageSizeArgs += [
            "${buildDir}/intermediates/merged_native_libs/${variant.name}",
            "${buildDir}/intermediates/stripped_native_libs/${variant.name}",
            "${buildDir}/intermediates/assets/${variant.name}/merge${variantCap}Assets"
    ]
    def fixNativeLibPageSize = tasks.register("fix${variantCap}NativeLibPageSize", Exec) {
        group = "verification"
        description = "Patch merged native libraries for Android 16 KB page-size compatibility (${variant.name})."
        workingDir rootProject.projectDir
        commandLine nativePageSizeArgs
    }

    fixNativeLibPageSize.configure {
        dependsOn "strip${variantCap}DebugSymbols", "merge${variantCap}Assets"
    }
    tasks.matching {
        it.name == "package${variantCap}" ||
                it.name == "bundle${variantCap}" ||
                it.name == "sign${variantCap}Bundle" ||
                it.name == "compress${variantCap}Assets"
    }.configureEach {
        dependsOn fixNativeLibPageSize, verifyLtwPackaging
    }

}

gradle.taskGraph.whenReady { taskGraph ->
    def buildsGooglePlay = taskGraph.allTasks.any { task ->
        task.path.toLowerCase(Locale.ROOT).contains("gplay")
    }
    if (buildsGooglePlay && !hasReleaseSigning) {
        throw new GradleException("Missing release signing config. Provide keystore.properties or GPLAY_KEYSTORE_* environment variables before building gplay.")
    }
}

