name: Battly Mobile Android CI

permissions:
  contents: write

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened, synchronize ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FIREBASE_DEBUG_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_DEBUG_GOOGLE_SERVICES_JSON_B64 }}
      FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64 }}
      GPLAY_KEYSTORE_B64: ${{ secrets.GPLAY_KEYSTORE_B64 }}
      GPLAY_KEY_ALIAS: ${{ secrets.GPLAY_KEY_ALIAS }}
      GPLAY_KEY_PASSWORD: ${{ secrets.GPLAY_KEY_PASSWORD }}
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      GPLAY_SERVICE_JSON: ${{ secrets.GPLAY_SERVICE_JSON }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Battly translations
        run: python3 tools/i18n/audit_android_i18n.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Prepare Firebase configs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/src/debug app_pojavlauncher/src/release app_pojavlauncher/src/gplay app_pojavlauncher/src/proguard app_pojavlauncher/src/proguardNoDebug

          if [ -n "${FIREBASE_DEBUG_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "$FIREBASE_DEBUG_GOOGLE_SERVICES_JSON_B64" | base64 -d > app_pojavlauncher/src/debug/google-services.json
          else
            cp app_pojavlauncher/src/debug/google-services.example.json app_pojavlauncher/src/debug/google-services.json
          fi
          cp app_pojavlauncher/src/debug/google-services.json app_pojavlauncher/src/proguard/google-services.json
          cp app_pojavlauncher/src/debug/google-services.json app_pojavlauncher/src/proguardNoDebug/google-services.json

          if [ -n "${FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "$FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64" | base64 -d > app_pojavlauncher/src/release/google-services.json
            cp app_pojavlauncher/src/release/google-services.json app_pojavlauncher/src/gplay/google-services.json
          else
            cp app_pojavlauncher/src/release/google-services.example.json app_pojavlauncher/src/release/google-services.json
            cp app_pojavlauncher/src/gplay/google-services.example.json app_pojavlauncher/src/gplay/google-services.json
          fi

      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GPLAY_KEYSTORE_B64:-}" ]; then
            echo "No GPLAY_KEYSTORE_B64 secret available. Skipping release signing setup."
            exit 0
          fi
          mkdir -p release-secrets
          echo "$GPLAY_KEYSTORE_B64" | base64 -d > release-secrets/battly-upload.jks
          cat > keystore.properties <<EOF
          storeFile=release-secrets/battly-upload.jks
          storePassword=${GPLAY_KEYSTORE_PASSWORD}
          keyAlias=${GPLAY_KEY_ALIAS:-upload}
          keyPassword=${GPLAY_KEY_PASSWORD:-$GPLAY_KEYSTORE_PASSWORD}
          EOF

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      - name: Build signed release artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -z "${GPLAY_KEYSTORE_B64:-}" ] || [ -z "${FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "Skipping signed release build: signing or production Firebase secrets are missing."
            exit 0
          fi
          ./gradlew :app_pojavlauncher:bundleGplay :app_pojavlauncher:assembleGplay --console=plain
          mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab
          mv app_pojavlauncher/build/outputs/apk/gplay/app_pojavlauncher-gplay.apk out/Battly-Mobile-2.0.3-beta.apk
          sha256sum out/app-gplay.aab > out/app-gplay.aab.sha256
          sha256sum out/Battly-Mobile-2.0.3-beta.apk > out/Battly-Mobile-2.0.3-beta.apk.sha256

      - name: Verify native 16 KB page-size compatibility
        if: hashFiles('out/app-gplay.aab') != ''
        shell: pwsh
        run: |
          ./tools/android/verify-native-16kb.ps1 -Path ./out/app-gplay.aab -SkipZipAlign
          ./tools/android/verify-native-16kb.ps1 -Path ./out/Battly-Mobile-2.0.3-beta.apk

      - name: Build Debug .apk
        run: |
          # Build the launcher
          ./gradlew :app_pojavlauncher:assembleDebug --console=plain
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload AAB
        if: hashFiles('out/app-gplay.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            out/app-gplay.aab
            out/app-gplay.aab.sha256

      - name: Upload signed release APK
        if: hashFiles('out/Battly-Mobile-2.0.3-beta.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: battly-mobile-release-apk
          path: |
            out/Battly-Mobile-2.0.3-beta.apk
            out/Battly-Mobile-2.0.3-beta.apk.sha256

      - name: Upload onto the Google Play testing track
        if: hashFiles('out/app-gplay.aab') != '' && env.GPLAY_SERVICE_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: com.tecnobros.battlylauncher
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('out/Battly-Mobile-2.0.3-beta.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/Battly-Mobile-2.0.3-beta.apk
            out/Battly-Mobile-2.0.3-beta.apk.sha256
            out/app-gplay.aab
            out/app-gplay.aab.sha256
