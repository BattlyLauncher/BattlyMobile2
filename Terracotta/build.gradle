plugins {
    id 'com.android.library'
}

android {
    namespace 'net.burningtnt.terracotta'
    compileSdk = 34

    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        proguard {
            initWith debug
        }
        proguardNoDebug {
            initWith release
        }
        gplay {
            initWith release
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.5.0'
}
