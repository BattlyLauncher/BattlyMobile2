# required for building jre_lwjgl3glfw with Java 8 while using plugins in app_pojavlauncher that require Java 11
org.gradle.configureondemand=true

android.useAndroidX=true
android.bundle.language.enableSplit=false
# Increase Gradle daemon RAM allocation
org.gradle.jvmargs=-Xmx4096M
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.r8.optimizedResourceShrinking=true

# BattlyWorlds uses Terracotta Scaffolding in EasyTier no-TUN mode. The feature
# is enabled without declaring Android's VPN service or connected-device FGS.
# The separate VPN switch remains only as an explicit legacy fallback.
battlyWorldsEnabled=true
battlyWorldsVpnEnabled=false
